name: Refresh live data

# Fetches the latest Nepal hazard / highway headlines every hour and commits the
# refreshed snapshots (assets/news_cache.json, assets/highways_cache.json) back
# to the repo, so the site keeps auto-updating even when served as static files.
on:
  schedule:
    - cron: '7 * * * *'      # every hour, at :07
  workflow_dispatch: {}       # also runnable on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest headlines
        run: node tools/refresh_live.js

      - name: Commit and push if changed
        run: |
          git config user.name  "nepaldisaster-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/news_cache.json assets/highways_cache.json)" ]; then
            git add assets/news_cache.json assets/highways_cache.json
            git commit -m "chore: auto-refresh live news & highway snapshots [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
