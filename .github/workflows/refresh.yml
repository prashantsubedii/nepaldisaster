name: Refresh live data

# Fetches the latest Nepal hazard / highway headlines every hour and commits the
# refreshed snapshots (assets/news_cache.json, assets/highways_cache.json) back
# to the repo, along with sitemap.xml and the baked-in headline
# (tools/build_seo.js), so the site keeps auto-updating even when served as
# static files.
on:
  schedule:
    - cron: '7 * * * *'      # every hour, at :07
  workflow_dispatch: {}       # also runnable on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history: build_seo.js dates sitemap entries from git log

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest headlines
        run: node tools/refresh_live.js

      - name: Bake headline into HTML and rebuild sitemap
        run: node tools/build_seo.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name  "nepaldisaster-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/news_cache.json assets/highways_cache.json sitemap.xml '*.html')" ]; then
            git add assets/news_cache.json assets/highways_cache.json sitemap.xml '*.html'
            git commit -m "chore: auto-refresh live news, highway snapshots & sitemap [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
          fi

      # Vercel (Hobby) refuses to deploy commits whose git author is not on the
      # Vercel project, which includes this bot and any collaborator. A deploy
      # hook deploys main regardless of author. Create one in Vercel → Project →
      # Settings → Git → Deploy Hooks (branch: main) and save its URL as the repo
      # secret VERCEL_DEPLOY_HOOK. Runs after a commit, or on every manual run
      # (Actions → Refresh live data → Run workflow) to push main live on demand.
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy triggered."
